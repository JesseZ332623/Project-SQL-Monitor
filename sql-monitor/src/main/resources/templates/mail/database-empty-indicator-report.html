<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>数据库指标报告</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #0d1117;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            overflow: hidden;
        }
        .header {
            background-color: #010409;
            padding: 20px;
            border-bottom: 1px solid #30363d;
        }
        .header h2 {
            margin: 0;
            color: #f0f6fc;
            font-size: 18px;
            font-weight: 600;
        }
        .content {
            padding: 40px 20px;
            text-align: center;
        }
        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        .empty-message {
            color: #c9d1d9;
            font-size: 16px;
            margin: 0 0 8px 0;
        }
        .empty-hint {
            color: #8b949e;
            font-size: 12px;
            margin: 0;
        }
        .footer {
            padding: 16px 20px;
            background-color: #010409;
            border-top: 1px solid #30363d;
            color: #8b949e;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>📊 【数据库指标监视器】例行数据库指标报告</h2>
    </div>

    <div class="content">
        <div class="empty-icon">📭</div>
        <p class="empty-message">今日暂无新指标数据</p>
        <p class="empty-hint">数据库运行平稳，暂无异常指标上报</p>
    </div>

    <div class="footer">
        SQL Monitor · 自动生成
    </div>
</div>
</body>
</html>
